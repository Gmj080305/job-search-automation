# Enable a source only after verifying its official career/ATS relationship,
# collection permissions, adapter settings and application URL prefixes.
#
# Supported adapters:
#   greenhouse: requires board
#   lever: requires site
#   html: reads JobPosting JSON-LD from explicit pages
#
# Additional settings for an enabled source:
#   verified: true
#   enabled: true
#   adapter: greenhouse | lever | html
#   application_prefixes: [verified official application URL prefix]
#
# HTML sources additionally require:
#   pages: [official pages containing JobPosting JSON-LD]
#   fetch_hosts: [exact permitted hostnames]

